<!doctype html>
<html>
  <body style="margin:0;background:#f7f5f0;color:#243039;font-family:Arial,sans-serif;">
    <div style="max-width:560px;margin:32px auto;padding:36px;background:#fbfaf7;border:1px solid #e5e3dc;">
      <p style="color:#cc5938;font-size:12px;letter-spacing:2px;text-transform:uppercase;">Driveboard reminder</p>
      <h1 style="font-family:Georgia,serif;font-weight:normal;">Your opportunity starts soon.</h1>
      <p>Hi {{ recipient_name }},</p>
      <p><strong>{{ company_name }}</strong> is coming up shortly.</p>
      <p>{{ company_location }} · {{ company_date.strftime('%b %-d, %Y at %-I:%M %p') }}</p>
      <p style="color:#788083;">Take a breath, check your details, and arrive ready.</p>
    </div>
  </body>
</html>
