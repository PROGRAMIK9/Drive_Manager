<!doctype html>
<html>
  <body style="margin:0;background:#f7f5f0;color:#243039;font-family:Arial,sans-serif;">
    <div style="max-width:560px;margin:32px auto;padding:36px;background:#fbfaf7;border:1px solid #e5e3dc;">
      <p style="color:#cc5938;font-size:12px;letter-spacing:2px;text-transform:uppercase;">Driveboard</p>
      <h1 style="font-family:Georgia,serif;font-weight:normal;">Welcome to your opportunity desk.</h1>
      <p>Hi {{ recipient_name }},</p>
      <p>Verify your email address to activate your Driveboard account.</p>
      <p><a href="{{ verification_url }}" style="display:inline-block;padding:12px 18px;color:#fff;background:#eb744f;text-decoration:none;border-radius:6px;">Verify email</a></p>
      <p style="color:#788083;font-size:12px;">This link expires soon. If you did not create this account, you can ignore this email.</p>
    </div>
  </body>
</html>
