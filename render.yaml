services:
  - type: web
    name: driveboard-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: uv sync --frozen
    startCommand: uv run --frozen python scripts/bootstrap_db.py && uv run --frozen uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: driveboard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RVCE_EMAIL_DOMAIN
        sync: false
      - key: SPC_EMAILS
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          name: driveboard-queue
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: driveboard-queue
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: driveboard-rvce
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: driveboard-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

  - type: worker
    name: driveboard-mail-worker
    runtime: python
    rootDir: backend
    plan: starter
    region: singapore
    buildCommand: uv sync --frozen
    startCommand: uv run --frozen celery -A app.tasks.mail_tasks:celery_app worker --loglevel=INFO
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: driveboard-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: driveboard-queue
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: driveboard-queue
          type: keyvalue
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: driveboard-api
          type: web
          envVarKey: SECRET_KEY
      - key: ALGORITHM
        fromService:
          name: driveboard-api
          type: web
          envVarKey: ALGORITHM
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        fromService:
          name: driveboard-api
          type: web
          envVarKey: ACCESS_TOKEN_EXPIRE_MINUTES
      - key: GOOGLE_CLIENT_ID
        fromService:
          name: driveboard-api
          type: web
          envVarKey: GOOGLE_CLIENT_ID
      - key: RVCE_EMAIL_DOMAIN
        fromService:
          name: driveboard-api
          type: web
          envVarKey: RVCE_EMAIL_DOMAIN
      - key: SPC_EMAILS
        fromService:
          name: driveboard-api
          type: web
          envVarKey: SPC_EMAILS
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: keyvalue
    name: driveboard-queue
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: driveboard-db
    databaseName: driveboard
    user: driveboard
    plan: free
    region: singapore
