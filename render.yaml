services:
  - type: web
    name: driveboard-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: uv sync --frozen
    preDeployCommand: uv run --frozen alembic upgrade head
    startCommand: PYTHONPATH=. uv run --frozen python scripts/bootstrap_db.py && PYTHONPATH=. uv run --frozen uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: driveboard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        value: https://driveboard-rvce.onrender.com
      - key: GOOGLE_PUBSUB_TOPIC
        sync: false
      - key: GOOGLE_PUBSUB_SUBSCRIPTION
        sync: false
      - key: GOOGLE_PUBSUB_AUDIENCE
        sync: false
      - key: GOOGLE_PUBSUB_SERVICE_ACCOUNT
        sync: false
      - key: SPCS_GMAIL_ADDRESS
        value: maaryamannp.mca25@rvce.edu.in
      - key: PLACEMENT_SENDER_DOMAIN
        value: rvce.edu.in
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: RVCE_EMAIL_DOMAIN
        sync: false
      - key: SPC_EMAILS
        sync: false
      - key: CORS_ORIGINS
        value: https://driveboard-rvce.onrender.com
      - key: MAIL_USERNAME
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: web
    name: driveboard-rvce
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: driveboard-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

databases:
  - name: driveboard-db
    databaseName: driveboard
    user: driveboard
    plan: free
    region: singapore
